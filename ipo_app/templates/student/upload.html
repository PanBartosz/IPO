{% extends "base.html" %}

{% block title %}Essay Upload{% endblock %}

{% block content %}
  <div id="student-upload-content" data-preserve-scroll="true">
    {% include "student/partials/upload_content.html" %}
  </div>
{% endblock %}

{% block extra_scripts %}
  {{ super() }}
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js"></script>
  <script>
    if (window["pdfjs-dist/build/pdf"] && !window.pdfjsLib) {
      window.pdfjsLib = window["pdfjs-dist/build/pdf"];
    }
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js";
    }
  </script>
  <script>
    (function () {
      const defaultPreviewUrl = "{{ url_for('web.student_upload_preview') }}";

      function initPdfPreview(root) {
        const preview = root.querySelector("#pdf-preview");
        if (!preview || preview.dataset.previewReady === "true") {
          return;
        }
        preview.dataset.previewReady = "true";
        if (!window.pdfjsLib) {
          return;
        }

        const previewUrl = preview.dataset.previewUrl || defaultPreviewUrl;
        const canvas = preview.querySelector("#pdf-canvas");
        const errorEl = preview.querySelector("#pdf-preview-error");
        const controlsEl = preview.querySelector("#pdf-preview-controls");
        const pageNumEl = preview.querySelector("#pdf-page-num");
        const pageCountEl = preview.querySelector("#pdf-page-count");
        const prevBtn = preview.querySelector("#pdf-prev");
        const nextBtn = preview.querySelector("#pdf-next");

        let pdfDoc = null;
        let currentPage = 1;

        const setButtonState = function () {
          if (!pdfDoc) {
            return;
          }
          if (prevBtn) {
            prevBtn.disabled = currentPage <= 1;
          }
          if (nextBtn) {
            nextBtn.disabled = currentPage >= pdfDoc.numPages;
          }
        };

        const renderPage = function (num) {
          if (!pdfDoc || !canvas) {
            return;
          }
          pdfDoc.getPage(num).then(function (page) {
            const containerWidth = canvas.parentElement.offsetWidth || 600;
            const viewport = page.getViewport({ scale: 1 });
            const scale = containerWidth / viewport.width;
            const scaledViewport = page.getViewport({ scale: scale });
            const context = canvas.getContext("2d");
            canvas.height = scaledViewport.height;
            canvas.width = scaledViewport.width;

            const renderContext = {
              canvasContext: context,
              viewport: scaledViewport,
            };
            page.render(renderContext).promise.then(function () {
              if (pageNumEl) {
                pageNumEl.textContent = num;
              }
              setButtonState();
            });
          });
        };

        const handleError = function (err) {
          if (errorEl) {
            errorEl.textContent = "Unable to display PDF preview: " + err.message;
            errorEl.style.display = "block";
          }
        };

        fetch(previewUrl, { credentials: "include" })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }
            return response.arrayBuffer();
          })
          .then(function (buffer) {
            return pdfjsLib.getDocument({ data: buffer }).promise;
          })
          .then(function (pdf) {
            pdfDoc = pdf;
            if (pageCountEl) {
              pageCountEl.textContent = pdfDoc.numPages;
            }
            if (controlsEl) {
              controlsEl.style.display = "flex";
            }
            renderPage(currentPage);

            if (prevBtn) {
              prevBtn.addEventListener("click", function () {
                if (currentPage <= 1) {
                  return;
                }
                currentPage -= 1;
                renderPage(currentPage);
              });
            }

            if (nextBtn) {
              nextBtn.addEventListener("click", function () {
                if (!pdfDoc || currentPage >= pdfDoc.numPages) {
                  return;
                }
                currentPage += 1;
                renderPage(currentPage);
              });
            }

            setButtonState();
          })
          .catch(handleError);
      }

      function initFinalizeModal(root) {
        const trigger = root.querySelector("#finalize-trigger");
        const modal = root.querySelector("#finalize-modal");
        if (!trigger || !modal || modal.dataset.modalReady === "true") {
          return;
        }
        modal.dataset.modalReady = "true";

        const closeButton = modal.querySelector(".message-modal__close");
        const cancelButton = modal.querySelector("#finalize-cancel");
        const confirmButton = modal.querySelector("#finalize-confirm");
        const finalizeForm = root.querySelector("#finalize-form");

        function openModal() {
          modal.classList.add("is-visible");
          document.body.classList.add("modal-open");
        }

        function closeModal() {
          modal.classList.remove("is-visible");
          document.body.classList.remove("modal-open");
        }

        trigger.addEventListener("click", openModal);
        if (closeButton) closeButton.addEventListener("click", closeModal);
        if (cancelButton) cancelButton.addEventListener("click", closeModal);

        modal.addEventListener("click", function (event) {
          if (event.target === modal) {
            closeModal();
          }
        });

        if (!document.body.dataset.finalizeModalKeyHandler) {
          document.body.dataset.finalizeModalKeyHandler = "true";
          document.addEventListener("keydown", function (event) {
            if (event.key !== "Escape") {
              return;
            }
            const openModalEl = document.querySelector("#finalize-modal.is-visible");
            if (openModalEl) {
              openModalEl.classList.remove("is-visible");
              document.body.classList.remove("modal-open");
            }
          });
        }

        if (confirmButton) {
          confirmButton.addEventListener("click", function () {
            if (!finalizeForm) {
              return;
            }
            if (typeof finalizeForm.requestSubmit === "function") {
              finalizeForm.requestSubmit();
            } else {
              finalizeForm.submit();
            }
          });
        }
      }

      function initUploadProgress(root) {
        const form = root.querySelector("[data-upload-form]");
        if (!form || form.dataset.progressReady === "true") {
          return;
        }
        form.dataset.progressReady = "true";
        const wrap = root.querySelector("#upload-progress-wrap");
        const progress = root.querySelector("#upload-progress");
        const label = root.querySelector("#upload-progress-label");

        function updateProgress(value) {
          if (!progress || !label) {
            return;
          }
          progress.value = value;
          label.textContent = value + "%";
        }

        form.addEventListener("htmx:beforeRequest", function () {
          if (wrap) {
            wrap.style.display = "block";
          }
          updateProgress(0);
        });

        form.addEventListener("htmx:xhr:progress", function (event) {
          const detail = event.detail || {};
          if (!detail.lengthComputable || !detail.total) {
            return;
          }
          const percent = Math.round((detail.loaded / detail.total) * 100);
          updateProgress(Math.min(100, Math.max(0, percent)));
        });

        const hideProgress = function () {
          if (wrap) {
            wrap.style.display = "none";
          }
        };

        form.addEventListener("htmx:afterRequest", hideProgress);
        form.addEventListener("htmx:responseError", hideProgress);
        form.addEventListener("htmx:sendError", hideProgress);
      }

      function initStudentUpload(root) {
        initPdfPreview(root);
        initFinalizeModal(root);
        initUploadProgress(root);
      }

      document.addEventListener("DOMContentLoaded", function () {
        initStudentUpload(document);
      });

      document.addEventListener("htmx:afterSwap", function (event) {
        const target = event.detail && event.detail.target;
        if (!target) {
          return;
        }
        if (
          target.id === "student-upload-content" ||
          (target.querySelector && target.querySelector("#student-upload-content")) ||
          (target.closest && target.closest("#student-upload-content"))
        ) {
          initStudentUpload(document);
        }
      });
    })();
  </script>
{% endblock %}
