{% extends "base.html" %}

{% block title %}Survey Responses · {{ survey.title }}{% endblock %}

{% block content %}
  <div id="survey-responses-content" data-preserve-scroll="true">
    {% include "admin/partials/surveys_responses_content.html" %}
  </div>
{% endblock %}

{% block extra_head %}
  {{ super() }}
  <link href="https://cdn.datatables.net/v/dt/dt-2.3.4/b-3.2.5/b-colvis-3.2.5/cr-2.1.2/fc-5.0.5/fh-4.0.4/r-3.0.7/sc-2.4.3/sp-2.3.5/sl-3.1.3/datatables.min.css" rel="stylesheet" integrity="sha384-7V4sHeZ5gBkojusGF2JLcv5cLqptUs610odNxbc3x9CDXveYAMGNVAjXEPsu3drR" crossorigin="anonymous">
{% endblock %}

{% block extra_scripts %}
  {{ super() }}
  <script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"></script>
  <script src="https://cdn.datatables.net/v/dt/dt-2.3.4/b-3.2.5/b-colvis-3.2.5/cr-2.1.2/fc-5.0.5/fh-4.0.4/r-3.0.7/sc-2.4.3/sp-2.3.5/sl-3.1.3/datatables.min.js" integrity="sha384-SRYEBMMalIqxjYashh81gN6nl6xSAUmF3zogz3k7AUNRFF/5NyVvztDKav+RTweM" crossorigin="anonymous"></script>
  <script>
    const initSurveyResponsesTable = () => {
      const table = document.getElementById('survey-responses-table');
      if (!table || table.dataset.dtReady === 'true') {
        return;
      }
      table.dataset.dtReady = 'true';
      new DataTable(table, {
        paging: true,
        pageLength: 25,
        lengthMenu: [10, 25, 50, 100],
        scrollX: true,
        responsive: false,
        order: [[0, 'asc']],
        layout: {
          top1Start: 'search',
          topEnd: 'pageLength',
          bottomStart: 'info',
          bottomEnd: 'paging'
        }
      });
    };

    document.addEventListener('DOMContentLoaded', initSurveyResponsesTable);
    document.addEventListener('htmx:afterSwap', (event) => {
      const target = event.detail && event.detail.target;
      if (target && (target.id === 'survey-responses-content' || target.querySelector('#survey-responses-table'))) {
        initSurveyResponsesTable();
      }
    });
  </script>
{% endblock %}
