{% extends "base.html" %}

{% block title %}Stage 1 · Admin{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="https://cdn.datatables.net/2.0.3/css/dataTables.dataTables.min.css">
  <script type="importmap">
    {
      "imports": {
        "jquery": "https://cdn.jsdelivr.net/npm/jquery@3.7.1/+esm"
      }
    }
  </script>
{% endblock %}

{% block main_class %}container-wide{% endblock %}

{% block content %}
  <div id="uploads-content" data-preserve-scroll="true">
    {% include "admin/partials/uploads_content.html" %}
  </div>
{% endblock %}

{% block extra_scripts %}
  <script type="module">
    import DataTable from 'https://cdn.datatables.net/2.0.3/js/dataTables.mjs';

    const initUploadsTable = () => {
      const table = document.getElementById('uploads-table');
      if (!table || table.dataset.dtReady === 'true') {
        return;
      }
      table.dataset.dtReady = 'true';
      new DataTable(table, {
        paging: true,
        pageLength: 25,
        order: [[0, 'asc']],
        responsive: true,
        layout: {
          topStart: 'search',
          topEnd: 'pageLength',
          bottomStart: 'info',
          bottomEnd: 'paging'
        }
      });
    };

    document.addEventListener('DOMContentLoaded', initUploadsTable);
    document.addEventListener('htmx:afterSwap', (event) => {
      const target = event.detail && event.detail.target;
      if (target && (target.id === 'uploads-content' || target.querySelector('#uploads-table'))) {
        initUploadsTable();
      }
    });
  </script>
{% endblock %}
