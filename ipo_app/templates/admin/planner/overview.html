{% extends "base.html" %}

{% block title %}Stage Planner · IPO{% endblock %}

{% block main_class %}container-wide{% endblock %}

{% block content %}
  <div id="planner-overview-content" data-preserve-scroll="true">
    {% include "admin/partials/planner_overview_content.html" %}
  </div>
{% endblock %}

{% block extra_scripts %}
  <script type="module">
    import DataTable from 'https://cdn.datatables.net/2.0.3/js/dataTables.mjs';

    const initPlannerTable = () => {
      const table = document.getElementById('batches-table');
      if (!table || table.dataset.dtReady === 'true') {
        return;
      }
      table.dataset.dtReady = 'true';
      new DataTable(table, {
        paging: false,
        searching: false,
        order: [[3, 'desc']],
      });
    };

    document.addEventListener('DOMContentLoaded', initPlannerTable);
    document.addEventListener('htmx:afterSwap', (event) => {
      const target = event.detail && event.detail.target;
      if (target && (target.id === 'planner-overview-content' || target.querySelector('#batches-table'))) {
        initPlannerTable();
      }
    });
  </script>
{% endblock %}
